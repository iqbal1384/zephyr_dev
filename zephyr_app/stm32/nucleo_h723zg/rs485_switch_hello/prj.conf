# GPIO for interrupt input (PE2) and Conn_1 output (PE3) and RS-485 DE (PG12).
# SERIAL for LPUART1 (RS-485 data) and USART3 (console, board default).
# No interrupt-driven UART needed - uart_poll_out() is sufficient for a
# one-shot "send and done" message at 115200.
CONFIG_GPIO=y
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_PRINTK=y
CONFIG_STDOUT_CONSOLE=y
