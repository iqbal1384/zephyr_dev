CONFIG_GPIO=y
CONFIG_SPI=y

# Zephyr stepper subsystem + the built-in TMC5160/5130/5161 (adi,tmc51xx) driver.
CONFIG_STEPPER=y
CONFIG_STEPPER_SHELL=y

CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
