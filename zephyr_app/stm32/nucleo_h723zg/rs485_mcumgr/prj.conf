# RS485 UART + DE GPIO
CONFIG_SERIAL=y
CONFIG_GPIO=y
CONFIG_UART_INTERRUPT_DRIVEN=y

# Hardware watchdog (IWDG): production safety net for the update flow. See
# APP_WDT_TIMEOUT_MS/APP_SELF_CONFIRM_GRACE_PERIOD_S in ./Kconfig.
# IWDG_STM32 auto-enables (default y, depends on the board's already-enabled
# &iwdg devicetree node).
CONFIG_WATCHDOG=y

# Settings-backed node address provisioning (rs485_envelope.c). Falls back to
# the board's existing storage_partition automatically - no devicetree change
# needed (settings_zms.c uses PARTITION_ID(storage_partition) when no
# zephyr,settings-partition chosen node exists).
#
# ZMS, not NVS: this board's erase-block-size is 128KB, but settings_nvs.c
# stores its sector size in a uint16_t (capped at 65535) and hard-errors
# with -EDOM ("Configuration error") the moment a hardware sector exceeds
# that - which every image on this board did, regardless of partition
# sizing. settings_zms.c's ZMS backend uses uint32_t instead and has no
# such ceiling; it's the intended replacement for exactly this case.
CONFIG_SETTINGS=y
CONFIG_ZMS=y
CONFIG_SETTINGS_ZMS=y

# Debug console on USART3 (ST-LINK VCP on this board, zephyr,console in the
# base devicetree) - a separate UART from LPUART1/RS485, safe to use for
# printk without disturbing the update transport.
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_PRINTK=y
CONFIG_STDOUT_CONSOLE=y

# MCUboot image-manager, app side (same as fan_control_v2/prj.conf). IMG_MANAGER
# is needed for boot_write_img_confirmed(), and itself depends on FLASH_MAP +
# STREAM_FLASH (not auto-selected).
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_STREAM_FLASH=y
CONFIG_IMG_MANAGER=y
CONFIG_MCUBOOT_IMG_MANAGER=y

# mcumgr core + SMP-over-serial framing helpers. We deliberately do NOT enable
# CONFIG_MCUMGR_TRANSPORT_UART (it ties to a fixed zephyr,uart-mcumgr chosen
# console UART whose TX path can't be wrapped with RS485 DE control without
# patching a vendored Zephyr driver). Instead we drive the same shared
# encode/decode helpers (mcumgr_serial_tx_pkt/mcumgr_serial_process_frag) from
# our own transport in smp_rs485_transport.c.
CONFIG_NET_BUF=y
CONFIG_ZCBOR=y
CONFIG_BASE64=y
CONFIG_CRC=y
CONFIG_MCUMGR=y
# Selects CONFIG_MCUMGR_TRANSPORT_SERIAL_HAS_SMP_OVER_CONSOLE (see ./Kconfig) -
# that symbol has no prompt so it can't be set directly in a .conf fragment.
CONFIG_APP_RS485_SMP_TRANSPORT=y

# mcumgr command groups
CONFIG_MCUMGR_GRP_IMG=y
CONFIG_MCUMGR_GRP_OS=y

# Bumped so this build is a distinguishable, newer image for the mcumgr
# upload/test/confirm flow (adds the led1 1Hz blink) - not required for the
# swap itself (MCUBOOT_DOWNGRADE_PREVENTION isn't enabled), just for clarity.
CONFIG_MCUBOOT_IMGTOOL_SIGN_VERSION="0.0.1+0"

# Sizing
CONFIG_MCUMGR_TRANSPORT_NETBUF_SIZE=384
CONFIG_MCUMGR_TRANSPORT_NETBUF_COUNT=4
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2304
