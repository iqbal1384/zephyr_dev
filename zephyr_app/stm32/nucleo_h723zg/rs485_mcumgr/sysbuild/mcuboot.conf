# Extra Kconfig fragment merged into MCUboot's own build (sysbuild picks this
# up automatically by filename convention).
#
# Unlike fan_control_v2, this project does NOT enable CONFIG_MCUBOOT_SERIAL:
# MCUboot itself does no firmware recovery here. Recovery/updates happen at
# the application level over RS485 via the custom SMP transport in
# smp_rs485_transport.c, since MCUboot's own serial-recovery UART driver has
# no concept of the RS485 DE GPIO and patching it was judged too invasive.
CONFIG_MCUBOOT_INDICATION_LED=y
