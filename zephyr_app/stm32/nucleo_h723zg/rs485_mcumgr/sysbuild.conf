# Build MCUboot alongside the app (west build --sysbuild, implied by the
# presence of this file). Mode defaults to "swap using offset": MCUboot boots
# the new image on trial and automatically reverts to the previous one if it's
# never confirmed (see boot_write_img_confirmed() in src/main.c). No scratch
# partition is needed for this mode, matching the board's existing flash
# layout (same as fan_control_v2).
SB_CONFIG_BOOTLOADER_MCUBOOT=y
