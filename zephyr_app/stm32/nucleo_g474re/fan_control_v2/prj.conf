CONFIG_CAN=y
CONFIG_GPIO=y
CONFIG_POLL=y
CONFIG_PWM=y
CONFIG_ADC=y

CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_PRINTK=y
CONFIG_STDOUT_CONSOLE=y

CONFIG_MAIN_STACK_SIZE=2048

# MCUboot support (bootloader image is built by sysbuild; CONFIG_BOOTLOADER_MCUBOOT
# and CONFIG_MCUBOOT_MODE_* are propagated to this app automatically from
# sysbuild.conf). IMG_MANAGER is needed for boot_write_img_confirmed() in main.c,
# and itself depends on FLASH_MAP + STREAM_FLASH (not auto-selected).
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_STREAM_FLASH=y
CONFIG_IMG_MANAGER=y
CONFIG_MCUBOOT_IMG_MANAGER=y
