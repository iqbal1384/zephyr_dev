# Extra Kconfig fragment merged into MCUboot's own build (sysbuild picks this
# up automatically by filename convention). Enables the serial recovery mode
# used to upload new firmware over the ST-LINK VCP UART.
CONFIG_GPIO=y
CONFIG_MCUBOOT_SERIAL=y
CONFIG_MCUBOOT_INDICATION_LED=y

# serial_adapter drives the console UART directly (raw driver API) for the
# mcumgr recovery protocol; it conflicts with the normal printk console on
# the same UART, so that must be off for this image.
CONFIG_UART_CONSOLE=n
