# Enable DAC Driver
CONFIG_DAC=y

# Hardware timer (TIM6) used to pace DAC sample updates from an ISR,
# instead of a busy-wait loop that drifts under IRQ load
CONFIG_COUNTER=y

# Console and Logging
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_PRINTK=y
CONFIG_STDOUT_CONSOLE=y

# GPIO for User LED
CONFIG_GPIO=y
