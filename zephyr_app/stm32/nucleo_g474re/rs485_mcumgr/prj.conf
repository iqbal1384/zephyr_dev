# RS485 UART + DE GPIO
CONFIG_SERIAL=y
CONFIG_GPIO=y
CONFIG_UART_INTERRUPT_DRIVEN=y

# Hardware watchdog (IWDG): production safety net for the update flow. See
# APP_WDT_TIMEOUT_MS/APP_SELF_CONFIRM_GRACE_PERIOD_S in ./Kconfig.
# IWDG_STM32 auto-enables (default y, depends on the board's already-enabled
# &iwdg devicetree node).
CONFIG_WATCHDOG=y

# Settings-backed node address provisioning (rs485_envelope.c). Falls back to
# the board's existing storage_partition automatically - no devicetree change
# needed (settings_nvs.c uses PARTITION_ID(storage_partition) when no
# zephyr,settings-partition chosen node exists).
CONFIG_SETTINGS=y
CONFIG_NVS=y
CONFIG_SETTINGS_NVS=y

# Debug console on LPUART1 (ST-LINK VCP) - a separate UART from USART1/RS485,
# safe to use for printk without disturbing the update transport.
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_PRINTK=y
CONFIG_STDOUT_CONSOLE=y

# MCUboot image-manager, app side (same as fan_control_v2/prj.conf). IMG_MANAGER
# is needed for boot_write_img_confirmed(), and itself depends on FLASH_MAP +
# STREAM_FLASH (not auto-selected).
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_STREAM_FLASH=y
CONFIG_IMG_MANAGER=y
CONFIG_MCUBOOT_IMG_MANAGER=y

# mcumgr core + SMP-over-serial framing helpers. We deliberately do NOT enable
# CONFIG_MCUMGR_TRANSPORT_UART (it ties to a fixed zephyr,uart-mcumgr chosen
# console UART whose TX path can't be wrapped with RS485 DE control without
# patching a vendored Zephyr driver). Instead we drive the same shared
# encode/decode helpers (mcumgr_serial_tx_pkt/mcumgr_serial_process_frag) from
# our own transport in smp_rs485_transport.c.
CONFIG_NET_BUF=y
CONFIG_ZCBOR=y
CONFIG_BASE64=y
CONFIG_CRC=y
CONFIG_MCUMGR=y
# Selects CONFIG_MCUMGR_TRANSPORT_SERIAL_HAS_SMP_OVER_CONSOLE (see ./Kconfig) -
# that symbol has no prompt so it can't be set directly in a .conf fragment.
CONFIG_APP_RS485_SMP_TRANSPORT=y

# mcumgr command groups
CONFIG_MCUMGR_GRP_IMG=y
CONFIG_MCUMGR_GRP_OS=y

# Sizing
CONFIG_MCUMGR_TRANSPORT_NETBUF_SIZE=384
CONFIG_MCUMGR_TRANSPORT_NETBUF_COUNT=4
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2304
