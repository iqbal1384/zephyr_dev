# Application stack
CONFIG_MAIN_STACK_SIZE=4096

# Console and logging
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_STDOUT_CONSOLE=y
CONFIG_PRINTK=y
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_LOG_MODE_IMMEDIATE=y

# Peripherals
CONFIG_I2C=y
CONFIG_GPIO=y

# Sensor Subsystem & VL53L8CX Driver
CONFIG_SENSOR=y
CONFIG_ST_VL53L8CX=y

# Heap for WrMulti: largest single alloc is 32768+2 bytes (VL53L8CX firmware block)
CONFIG_HEAP_MEM_POOL_SIZE=40960

# Interrupt mode required for large (>255 byte) I2C writes to VL53L8CX command mailbox.
CONFIG_I2C_STM32_INTERRUPT=y

# At 400 kHz (Fast mode), uploading the 32 KB VL53L8CX firmware takes ~740 ms.
CONFIG_I2C_STM32_TRANSFER_TIMEOUT_MSEC=5000
