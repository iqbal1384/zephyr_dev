# Enable GPIO driver (needed for LEDs/buttons)
CONFIG_GPIO=y
CONFIG_NANOPB=y

# (Optional) enable console + printk/printf over UART
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_PRINTK=y
CONFIG_STDOUT_CONSOLE=y

# Interrupt-driven RX on the console UART, used to receive LedCommand frames
# sent by led-ctrl on the Raspberry Pi.
CONFIG_UART_INTERRUPT_DRIVEN=y
