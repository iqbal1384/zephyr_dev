# SPI + GPIO for the e-paper panel
CONFIG_SPI=y
CONFIG_GPIO=y

# Console + logging
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_PRINTK=y
CONFIG_STDOUT_CONSOLE=y

CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y

# One 800-wide 4bpp scanline (400 bytes) lives on the stack while streaming
CONFIG_MAIN_STACK_SIZE=2048
