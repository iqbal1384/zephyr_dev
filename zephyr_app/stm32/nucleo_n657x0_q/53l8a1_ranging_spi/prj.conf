# Application config
CONFIG_MAIN_STACK_SIZE=4096

# SPI
CONFIG_SPI=y

# GPIO (for PWR_EN and LPn control)
CONFIG_GPIO=y

# Console / UART
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y

# Note: the I2C variant needed CONFIG_HEAP_MEM_POOL_SIZE because its WrMulti()
# had to k_malloc() a contiguous [register-address + payload] buffer (up to
# ~32 KB for firmware blocks) before each i2c_write(). The SPI platform layer
# instead uses scatter/gather spi_buf_set entries (address, then payload, in
# one NCS-low transceive), so no heap is needed — see platform.c.
