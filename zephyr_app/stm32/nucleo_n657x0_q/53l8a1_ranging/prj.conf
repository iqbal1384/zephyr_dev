# Application config
CONFIG_MAIN_STACK_SIZE=4096

# I2C
CONFIG_I2C=y

# GPIO (for PWR_EN and LPn control)
CONFIG_GPIO=y

# Console / UART
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y

# Heap for WrMulti: largest single alloc is 32768+2 bytes (firmware block)
CONFIG_HEAP_MEM_POOL_SIZE=40960

# Interrupt mode required for large (>255 byte) I2C writes to VL53L8CX command mailbox.
# Polling mode (=n) hits the STM32N6 NBYTES/RELOAD boundary at 255 bytes, corrupting
# the 488-byte offset and 776-byte xtalk commands (MCU returns status 0x05).
CONFIG_I2C_STM32_INTERRUPT=y

# At 400 kHz (Fast mode), uploading the 32 KB VL53L8CX firmware takes ~740 ms.
# The default 500 ms timeout is too short — raise to 5 s to cover worst case.
CONFIG_I2C_STM32_TRANSFER_TIMEOUT_MSEC=5000
